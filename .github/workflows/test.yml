name: ci

on:
  push:
  pull_request:

jobs:
  build-and-test:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Install Nix
        uses: cachix/install-nix-action@v31

      - name: Run tests
        run: nix develop --command cargo test --all-targets

      - name: Build package
        run: nix build .#default

      - name: Stage binary artifact
        run: |
          mkdir -p dist
          cp result/bin/temtop-sensor dist/temtop-sensor

      - name: Upload binary artifact
        uses: actions/upload-artifact@v4
        with:
          name: temtop-sensor-${{ github.sha }}
          path: dist/temtop-sensor
