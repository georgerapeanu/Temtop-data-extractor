name: release

on:
  push:
    tags:
      - "v*"

permissions:
  contents: write

jobs:
  build-release:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Install Nix
        uses: cachix/install-nix-action@v31

      - name: Build package
        run: nix build .#default

      - name: Stage release asset
        run: |
          mkdir -p dist
          cp result/bin/temtop-sensor dist/temtop-sensor-linux-amd64

      - name: Publish GitHub release
        uses: softprops/action-gh-release@v2
        with:
          files: dist/temtop-sensor-linux-amd64
